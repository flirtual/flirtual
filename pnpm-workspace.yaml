packages:
  - apps/*
  - "!apps/image-classification"

catalog:
  "@ariesclark/eslint-config": 3.2.1-canary.1
  "@cloudflare/vitest-pool-workers": ^0.21.0
  eslint: ^9.39.1
  typescript: ^5.9.2
  vitest: ~4.1.10
  wrangler: ^4.120.1

overrides:
  # 3.18.3 fails to resolve Tailwind v3: "Error while loading rule
  # 'tailwindcss/enforces-negative-arbitrary-values': Could not resolve tailwindcss".
  eslint-plugin-tailwindcss: 3.18.2

cleanupUnusedCatalogs: true
verifyDepsBeforeRun: install

ignoredBuiltDependencies:
  - "@shgysk8zer0/polyfills"

minimumReleaseAge: 4320

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@sentry/cli"
  - core-js
  - esbuild
  - exifreader
  - oxc-resolver
  - protobufjs
  - sharp
  - workerd
