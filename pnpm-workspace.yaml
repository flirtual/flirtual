packages:
  - apps/*
  - packages/*
  - pulumi

catalog:
  "@ariesclark/eslint-config": 3.2.1-canary.1
  "@cloudflare/build-output-utils": 0.8.6
  "@cloudflare/config": 0.24.0
  "@cloudflare/vitest-pool-workers": ^0.22.0
  "@total-typescript/ts-reset": 0.6.1
  "@types/node": 24.19.0
  cf: 1.0.0-beta.12
  eslint: ^9.39.1
  execa: ^10.0.1
  jose: ^6.2.12
  oxfmt: ^0.72.0
  oxlint: ^1.83.0
  sharp: 0.35.5
  typed-openapi: 4.1.0
  typescript: ^5.9.2
  vitest: ~5.0.0
  wrangler: ^4.120.1

catalogs:
  pulumi:
    "@pulumi/aws": ^7.46.0
    "@pulumi/cloudflare": 6.22.0
    "@pulumi/command": 1.2.1
    "@pulumi/postgresql": ^3.18.0
    "@pulumi/pulumi": 3.268.0
    "@pulumi/random": ^4.21.0
    "@pulumi/tls": ^5.6.1
    "@pulumiverse/time": ^0.1.1
    change-case: ^5.4.4
    globby: ^16.2.2
    openapi-fetch: ^0.17.0
    yaml: ^2.9.0

overrides:
  # 3.18.3 fails to resolve Tailwind v3: "Error while loading rule
  # 'tailwindcss/enforces-negative-arbitrary-values': Could not resolve tailwindcss".
  eslint-plugin-tailwindcss: 3.18.2
  # Override tsup's pinned esbuild ^0.27.0 to fix GHSA-g7r4-m6w7-qqqr.
  "tsup>esbuild": ">=0.28.1"
  # Override shepherd.js's pinned deepmerge-ts ^7 to fix GHSA-ggr8-5vv4-36mx.
  # Drop once shipshapecode/shepherd#3485 lands and shepherd releases.
  "shepherd.js>deepmerge-ts": ">=8.0.0"

auditConfig:
  ignoreGhsas:
    # Quill XSS via HTML export, unpatched upstream. Not applicable with
    # useSemanticHTML={false} and bio sanitization.
    - GHSA-v3m3-f69x-jf25
    # uuid bounds check in v3/v5/v6 with `buf`. Only reachable via xcode, which
    # calls v4 with no buf and pins uuid ^7.
    - GHSA-w5hq-g745-h8pq

verifyDepsBeforeRun: install

minimumReleaseAge: 4320

strictPeerDependencies: false

allowBuilds:
  "@parcel/watcher": true
  "@pulumi/apple@file:pulumi/sdks/apple": true
  "@pulumi/command": true
  "@pulumi/discord@file:pulumi/sdks/discord": true
  "@pulumi/freshdesk@file:pulumi/sdks/freshdesk": true
  "@pulumi/sentry@file:pulumi/sdks/sentry": true
  "@sentry/cli": true
  "@shgysk8zer0/polyfills": false
  core-js: true
  esbuild: true
  exifreader: true
  oxc-resolver: true
  protobufjs: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  # Renovate security update: sanitize-html@2.17.7
  - sanitize-html@2.17.7
  # Renovate security update: svgo@4.1.0
  - svgo@4.1.0
  # Renovate security update: sharp@0.35.4
  - sharp@0.35.4
  # cf is in beta and ships fixes daily; a 3-day delay pins it to stale betas.
  # Its exact-pinned dependencies release with it, including the runtime
  # Wrangler shares.
  - cf
  - "@cloudflare/build-output-utils"
  - "@cloudflare/codemods"
  - "@cloudflare/config"
  - "@cloudflare/runtime-types"
  - "@cloudflare/workerd-*"
  - miniflare
  - workerd
patchedDependencies:
  attachments@0.15.0: patches/signal-tus-server.patch
