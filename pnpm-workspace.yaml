packages:
  - apps/*

catalog:
  "@ariesclark/eslint-config": 3.2.1-canary.1
  "@cloudflare/vitest-pool-workers": ^0.22.0
  eslint: ^9.39.1
  typescript: ^5.9.2
  vitest: ~4.1.10
  wrangler: ^4.120.1

overrides:
  # 3.18.3 fails to resolve Tailwind v3: "Error while loading rule
  # 'tailwindcss/enforces-negative-arbitrary-values': Could not resolve tailwindcss".
  eslint-plugin-tailwindcss: 3.18.2
  # Override tsup's pinned esbuild ^0.27.0 to fix GHSA-g7r4-m6w7-qqqr.
  "tsup>esbuild": ">=0.28.1"
  # Override shepherd.js's pinned deepmerge-ts ^7 to fix GHSA-ggr8-5vv4-36mx.
  # Drop once shipshapecode/shepherd#3485 lands and shepherd releases.
  "shepherd.js>deepmerge-ts": ">=8.0.0"

auditConfig:
  ignoreGhsas:
    # Quill XSS via HTML export, unpatched upstream. Not applicable with
    # useSemanticHTML={false} and bio sanitization.
    - GHSA-v3m3-f69x-jf25
    # uuid bounds check in v3/v5/v6 with `buf`. Only reachable via xcode, which
    # calls v4 with no buf and pins uuid ^7.
    - GHSA-w5hq-g745-h8pq

cleanupUnusedCatalogs: true
verifyDepsBeforeRun: install

minimumReleaseAge: 4320

strictPeerDependencies: false

allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@shgysk8zer0/polyfills": false
  core-js: true
  esbuild: true
  exifreader: true
  oxc-resolver: true
  protobufjs: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  # Renovate security update: sanitize-html@2.17.7
  - sanitize-html@2.17.7
