on:
  push:
    branches: [main, production]
    paths:
      - "**/*.py"
      - .github/workflows/codeql-python.yaml
  pull_request:
    paths:
      - "**/*.py"
      - .github/workflows/codeql-python.yaml
  schedule:
    - cron: 13 19 * * 6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:python
