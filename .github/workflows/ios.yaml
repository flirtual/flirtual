name: iOS
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      channel:
        description: App to build and upload
        type: choice
        options: [beta, production]
        default: beta

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.channel || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VITE_ORIGIN: ${{ inputs.channel == 'production' && 'https://flirtu.al' || 'https://beta.flirtual.dev' }}
  VITE_API_URL: ${{ inputs.channel == 'production' && 'https://api.flirtu.al/v1/' || 'https://beta-api.flirtual.dev/v1/' }}
  VITE_APP_BUNDLE_ID: ${{ inputs.channel == 'production' && 'zone.homie.flirtual.pwa' || 'zone.homie.flirtual.beta' }}
  VITE_APP_STORE_ID: "6450485324"
  VITE_BRAND_NAME: ${{ vars.VITE_BRAND_NAME }}
  VITE_BRAND_DATE_COLORS: ${{ vars.VITE_BRAND_DATE_COLORS }}
  VITE_BRAND_HOMIE_COLORS: ${{ vars.VITE_BRAND_HOMIE_COLORS }}
  VITE_FEATURE_HOMIE_MODE: ${{ vars.VITE_FEATURE_HOMIE_MODE }}
  VITE_FEATURE_PERSONALITY: ${{ vars.VITE_FEATURE_PERSONALITY }}
  VITE_FEATURE_VR_TAGS: ${{ vars.VITE_FEATURE_VR_TAGS }}
  SCHEME: ${{ inputs.channel == 'production' && 'Flirtual' || 'Flirtual Beta' }}
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      native: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect changes
        uses: ./.github/actions/changes
        id: changes
        with:
          filter: ios

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.native == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: xcode-27
    defaults:
      run:
        working-directory: apps/frontend
    outputs:
      resolved-stale: ${{ steps.resolved.outputs.stale }}
    env:
      RENOVATE: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.22.1
          cache: true

      - name: Sync native project
        run: pnpm cap sync ios

      - name: Update Swift packages
        if: env.RENOVATE == 'true'
        run: rm ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Build
        working-directory: apps/frontend/ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme "$SCHEME" \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO

      - name: Check Package.resolved
        id: resolved
        if: github.event_name == 'pull_request'
        working-directory: apps/frontend/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
        run: |
          git diff --quiet -- Package.resolved && exit 0
          if [ "$RENOVATE" = true ]; then
            echo stale=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff -- Package.resolved
          echo "::error::Package.resolved is out of date. Build the iOS app locally and commit it."
          exit 1

      - name: Upload Package.resolved
        if: steps.resolved.outputs.stale == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Package.resolved
          path: apps/frontend/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

  resolved:
    name: Commit Package.resolved
    needs: build
    if: needs.build.outputs.resolved-stale == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Package.resolved
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Package.resolved

      - name: Create app token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          repositories: flirtual
          permission-contents: write

      - name: Commit Package.resolved
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg oid "$HEAD_SHA" \
            --arg contents "$(base64 -w0 Package.resolved)" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $oid,
                message: {headline: "chore(ios): update Package.resolved"},
                fileChanges: {additions: [{
                  path: "apps/frontend/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved",
                  contents: $contents
                }]}
              }}
            }' \
            | gh api graphql --input -

  release:
    name: Release
    needs: changes
    if: (needs.changes.outputs.native == 'true' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    environment: mobile
    defaults:
      run:
        working-directory: apps/frontend
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.22.1
          cache: true

      - name: Sync native project
        run: pnpm cap sync ios

      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_API_KEY_ID.p8"

      - name: Import distribution certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Install provisioning profiles
        env:
          APP_PROFILE: ${{ inputs.channel == 'production' && secrets.APPLE_PROFILE_PRODUCTION || secrets.APPLE_PROFILE_BETA }}
          WATCH_PROFILE: ${{ inputs.channel == 'production' && secrets.APPLE_PROFILE_WATCH_PRODUCTION || secrets.APPLE_PROFILE_WATCH_BETA }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          for PROFILE in "$APP_PROFILE" "$WATCH_PROFILE"; do
            printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
            PLIST=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")
            UUID=$(printf '%s' "$PLIST" | plutil -extract UUID raw -o - -)
            cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
            echo "Installed profile: $(printf '%s' "$PLIST" | plutil -extract Name raw -o - -) ($UUID)"
          done

      - name: Archive
        working-directory: apps/frontend/ios/App
        env:
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -onlyUsePackageVersionsFromResolvedFile \
            -scheme "$SCHEME" \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/Flirtual.xcarchive" \
            CURRENT_PROJECT_VERSION=$(( GITHUB_RUN_NUMBER + ${BUILD_NUMBER_OFFSET:-100} )) \
            VITE_BRAND_NAME="$VITE_BRAND_NAME" \
            VITE_BRAND_DATE_COLORS="$VITE_BRAND_DATE_COLORS" \
            VITE_BRAND_HOMIE_COLORS="$VITE_BRAND_HOMIE_COLORS" \
            VITE_FEATURE_HOMIE_MODE="$VITE_FEATURE_HOMIE_MODE" \
            VITE_FEATURE_PERSONALITY="$VITE_FEATURE_PERSONALITY" \
            VITE_FEATURE_VR_TAGS="$VITE_FEATURE_VR_TAGS"

      - name: Upload to App Store Connect
        working-directory: apps/frontend/ios/App
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>zone.homie.flirtual.pwa</key>
              <string>Flirtual App Store</string>
              <key>zone.homie.flirtual.pwa.watch</key>
              <string>Flirtual Watch App Store</string>
              <key>zone.homie.flirtual.beta</key>
              <string>Flirtual Beta App Store</string>
              <key>zone.homie.flirtual.beta.watch</key>
              <string>Flirtual Beta Watch App Store</string>
            </dict>
            <key>teamID</key>
            <string>997W5KLYVR</string>
            <key>manageAppVersionAndBuildNumber</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Flirtual.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_API_KEY_ID.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"

  ios:
    name: iOS
    if: always() && needs.changes.outputs.native != 'false'
    needs: [changes, build, resolved, release]
    runs-on: ubuntu-latest
    steps:
      - name: Determine overall status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
