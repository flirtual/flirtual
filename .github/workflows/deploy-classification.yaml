name: Image classification
on:
  push:
    branches: [main, production]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image-classification: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect changes
        uses: ./.github/actions/changes
        id: changes
        with:
          filter: image-classification

  image:
    name: Build Image Classification
    needs: changes
    if: needs.changes.outputs.image-classification != 'false'
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to the Fly registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: env.PUBLISH == 'true'
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/image-classification/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: registry.fly.io/image-classification:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image-classification:
    name: Image classification
    if: always() && needs.changes.outputs.image-classification != 'false'
    needs: [changes, image]
    runs-on: ubuntu-latest
    steps:
      - name: Determine overall status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  deploy:
    name: Deploy Image Classification
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    needs: [image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      - name: Deploy to Fly
        run: flyctl deploy --image registry.fly.io/image-classification:${{ github.sha }}
        working-directory: ./apps/image-classification
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
