name: Deploy Image Classification
on:
  push:
    paths: [ "apps/image-classification/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/deploy-classification.yaml" ]
  pull_request:
    paths: [ "apps/image-classification/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/deploy-classification.yaml" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    name: Build Image Classification
    if: >-
      github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/image-classification/Dockerfile
          push: true
          tags: registry.fly.io/image-classification:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Image Classification
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    needs: [image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --image registry.fly.io/image-classification:${{ github.sha }}
        working-directory: ./apps/image-classification
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
