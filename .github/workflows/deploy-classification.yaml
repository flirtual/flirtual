name: Deploy Image Classification
on:
  push:
    branches: [main, production]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image-classification: ${{ steps.filter.outputs.image-classification }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            image-classification:
              - 'apps/image-classification/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/deploy-classification.yaml'

  image:
    name: Build Image Classification
    needs: changes
    if: needs.changes.outputs.image-classification != 'false'
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: env.PUBLISH == 'true'
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/image-classification/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: registry.fly.io/image-classification:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image-classification:
    if: always()
    needs: [changes, image]
    runs-on: ubuntu-latest
    steps:
      - name: Determine overall status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  deploy:
    name: Deploy Image Classification
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    needs: [image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      - run: flyctl deploy --image registry.fly.io/image-classification:${{ github.sha }}
        working-directory: ./apps/image-classification
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
