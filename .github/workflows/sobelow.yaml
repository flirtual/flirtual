on:
  push:
    branches: [main, production]
    paths: &paths
      - apps/api/**
      - .github/workflows/sobelow.yaml
  pull_request:
    paths: *paths
  schedule:
    - cron: 13 19 * * 6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (elixir)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Run Sobelow
        uses: sobelow/action@v1.2.0
        with:
          flags: --root apps/api --skip

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: /language:elixir
