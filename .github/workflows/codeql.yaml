on:
  push:
    branches: [main, production]
  pull_request:
  schedule:
    - cron: 13 19 * * 6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          - language: python
            build-mode: none
            runner: ubuntu-latest
          - language: java-kotlin
            build-mode: manual
            runner: ubuntu-latest
          - language: swift
            build-mode: manual
            runner: macos-26
    env:
      VITE_ORIGIN: https://flirtu.al
      VITE_API_URL: https://api.flirtu.al/v1/
      VITE_APP_BUNDLE_ID: zone.homie.flirtual.pwa
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        if: matrix.build-mode == 'manual'
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        if: matrix.build-mode == 'manual'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        if: matrix.build-mode == 'manual'
        working-directory: apps/frontend
        run: pnpm install

      - name: Sync Android project
        if: matrix.language == 'java-kotlin'
        working-directory: apps/frontend
        run: pnpm cap sync android

      - name: Sync iOS project
        if: matrix.language == 'swift'
        working-directory: apps/frontend
        run: pnpm cap sync ios

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Android app
        if: matrix.language == 'java-kotlin'
        working-directory: apps/frontend/android
        run: ./gradlew --no-daemon assembleProductionDebug

      - name: Build iOS app
        if: matrix.language == 'swift'
        working-directory: apps/frontend/ios/App
        run: |
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme Flirtual \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO

      - name: Build visionOS app
        if: matrix.language == 'swift'
        working-directory: apps/frontend/visionos
        run: |
          xcodebuild build \
            -project FlirtualVision.xcodeproj \
            -target FlirtualVision \
            -sdk xrsimulator \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
