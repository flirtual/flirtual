name: Frontend
on:
  push:
    branches: [main, production]
  pull_request:
  merge_group:
  schedule:
    - cron: 0 12 * * 1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      frontend: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect changes
        uses: ./.github/actions/changes
        id: changes
        with:
          filter: frontend

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.frontend != 'false'
    runs-on: ubuntu-latest
    permissions:
      checks: write
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Register ESLint annotations
        run: echo "::add-matcher::.github/annotation-eslint.json"

      - name: Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24.22.1
          cache: true

      - name: ESLint
        run: ./node_modules/.bin/eslint -f stylish

  audit:
    name: Audit dependencies
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24.22.1
          cache: true

      - name: Audit dependencies
        run: pnpm audit --audit-level low --ignore-registry-errors

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.frontend != 'false'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/production' && 'production' || 'preview' }}
      deployment: false
    permissions:
      checks: write
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Forward VITE_* repository variables
        env:
          VARS: ${{ toJSON(vars) }}
        run: |
          echo "$VARS" | jq -r '
            to_entries[] | select(.key | startswith("VITE_"))
            | "\(.key)<<__EOF__\n\(.value)\n__EOF__"' >> "$GITHUB_ENV"

      - name: Register TypeScript annotations
        run: echo "::add-matcher::.github/annotation-typescript.json"

      - name: Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24.22.1
          cache: true

      - name: Build
        run: pnpm build

      - name: TypeScript
        run: |
          ./node_modules/.bin/tsc --pretty false --noEmit | sed -E "s#^.+\(.+\): error TS.+\$#$PWD/\0#"
          exit ${PIPESTATUS[0]}

  release:
    name: Deploy
    if: github.event_name != 'merge_group' && github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [build]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      checks: write
    environment:
      name: ${{ github.ref == 'refs/heads/production' && 'production' || 'preview' }}
      url: ${{ steps.preview.outputs.url }}
    defaults:
      run:
        working-directory: apps/frontend
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Forward VITE_* repository variables
        env:
          VARS: ${{ toJSON(vars) }}
        run: |
          echo "$VARS" | jq -r '
            to_entries[] | select(.key | startswith("VITE_"))
            | "\(.key)<<__EOF__\n\(.value)\n__EOF__"' >> "$GITHUB_ENV"

      - name: Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24.22.1
          cache: true

      - name: Cache build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/frontend/node_modules/.cache
          key: build-cache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: build-cache-${{ github.ref_name }}-

      - name: Deploy production
        if: github.ref == 'refs/heads/production'
        run: pnpm run production

      - name: Compute preview alias
        id: preview
        if: github.ref != 'refs/heads/production'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            label="$PR_NUMBER"
          else
            label="${GITHUB_SHA::7}"
          fi
          echo "PREVIEW_LABEL=$label" >> "$GITHUB_ENV"
          echo "PREVIEW_ALIAS=git-$label" >> "$GITHUB_ENV"
          echo "url=https://$label.flirtual.dev" >> "$GITHUB_OUTPUT"

      - name: Upload preview version
        if: github.ref != 'refs/heads/production'
        env:
          VITE_ORIGIN: https://${{ env.PREVIEW_LABEL }}.flirtual.dev
          VITE_API_URL: https://api-${{ env.PREVIEW_LABEL }}.flirtual.dev/v1/
        run: pnpm run preview "$PREVIEW_ALIAS"

      - name: Point flirtual.dev at this preview
        if: github.ref == 'refs/heads/main'
        run: pnpm exec wrangler kv key put latest "$PREVIEW_LABEL" --binding=PREVIEW_STATE -c ../preview-router/wrangler.jsonc --remote

      - name: Deploy beta
        if: github.ref == 'refs/heads/main'
        env:
          VITE_ORIGIN: https://beta.flirtual.dev
          VITE_API_URL: https://beta-api.flirtual.dev/v1/
        run: pnpm run canary

  frontend:
    name: Frontend
    if: always() && needs.changes.outputs.frontend != 'false'
    needs: [changes, lint, audit, build]
    runs-on: ubuntu-latest
    steps:
      - name: Determine overall status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
