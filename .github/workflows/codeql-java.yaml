on:
  push:
    branches: [main, production]
    paths: &paths
      - apps/frontend/android/**
      - apps/frontend/capacitor.config.ts
      - apps/frontend/package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/codeql-java.yaml
  pull_request:
    paths: *paths
  schedule:
    - cron: 13 19 * * 6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    env:
      VITE_ORIGIN: https://flirtu.al
      VITE_API_URL: https://api.flirtu.al/v1/
      VITE_APP_BUNDLE_ID: zone.homie.flirtual.pwa
      VITE_APP_STORE_ID: "6450485324"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: apps/frontend
        run: pnpm install

      - name: Sync native project
        working-directory: apps/frontend
        run: pnpm cap sync android

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build app
        working-directory: apps/frontend/android
        run: ./gradlew --no-daemon assembleProductionDebug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:java-kotlin
          output: sarif
          upload: false

      - name: Drop results from vendored code
        run: |
          for file in sarif/*.sarif; do
            jq '.runs[].results |= map(select(
              (.locations[0].physicalLocation.artifactLocation.uri // "")
                | test("(^|/)(node_modules|Pods)/") | not
            ))' "$file" > "$file.filtered"
            mv "$file.filtered" "$file"
          done

      - name: Upload results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: sarif
          category: /language:java-kotlin
