apply plugin: 'com.android.application'

def brandDefaults = new groovy.json.JsonSlurper().parse(file("../../src/brand.defaults.json"))

def brandAccentColor = {
    def colors = (System.getenv("VITE_BRAND_DATE_COLORS") ?: "").split(",")*.trim().findAll { it }
    colors.size() == 2 ? colors[1] : brandDefaults.dateColors[1]
}()

def brandName = System.getenv("VITE_BRAND_NAME") ?: brandDefaults.name

def bundleId = { String fallback -> System.getenv("VITE_APP_BUNDLE_ID") ?: fallback }
def appScheme = { String fallback -> System.getenv("APP_SCHEME") ?: fallback }

def appLinkHosts = (System.getenv("APP_LINK_HOSTS") ?: "").split(",")*.trim().findAll { it }
def appLinksManifest = file("build/generated/app-links/AndroidManifest.xml")
if (appLinkHosts) {
    def hosts = appLinkHosts.collect { "                <data android:scheme=\"https\" android:host=\"$it\" />" }.join("\n")
    appLinksManifest.parentFile.mkdirs()
    appLinksManifest.text = """<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <application>
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter android:autoVerify="true">
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
$hosts
            </intent-filter>
        </activity>
    </application>
</manifest>
"""
}
def assetStatements = groovy.json.JsonOutput.toJson(
    appLinkHosts.collect { [include: "https://$it/.well-known/assetlinks.json".toString()] }
).replace('"', '\\"')

android {
    namespace "zone.homie.flirtual.pwa"
    compileSdk rootProject.ext.compileSdkVersion

    buildFeatures {
        resValues true
    }

    defaultConfig {
        resValue "color", "brand", brandAccentColor
        resValue "string", "brand_name", brandName
        resValue "string", "app_name", brandName
        resValue "string", "title_activity_main", brandName
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode System.getenv("CI_VERSION_CODE") ? System.getenv("CI_VERSION_CODE").toInteger() : 1
        versionName '1.4.4'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    flavorDimensions "environment"
    productFlavors {
        production {
            dimension "environment"
            applicationId bundleId("zone.homie.flirtual.pwa")
            resValue "string", "custom_url_scheme", appScheme("flirtual")
        }
        beta {
            dimension "environment"
            applicationId bundleId("zone.homie.flirtual.beta")
            resValue "string", "custom_url_scheme", appScheme("flirtual-beta")
            resValue "string", "app_name", "$brandName Beta"
            resValue "string", "title_activity_main", "$brandName Beta"
        }
    }

    if (appLinkHosts) {
        sourceSets {
            production.manifest.srcFile appLinksManifest
            beta.manifest.srcFile appLinksManifest
        }
        productFlavors.all { resValue "string", "asset_statements", assetStatements }
    }

    signingConfigs {
        if (System.getenv("ANDROID_KEYSTORE_PATH")) {
            ci {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.ci
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "com.google.android.material:material:$materialVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "com.google.firebase:firebase-messaging:26.0.2"
    implementation "androidx.datastore:datastore-preferences:1.3.0"
    implementation "androidx.core:core:1.6.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
